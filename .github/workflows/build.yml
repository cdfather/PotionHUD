name: Build 1.8.9 Forge Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle 2.14
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '2.14'

    - name: Build Mod with Gradle 2.14
      run: gradle build

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 1-Pixel-PotionHUD-1.8.9
        path: build/libs/*.jar
